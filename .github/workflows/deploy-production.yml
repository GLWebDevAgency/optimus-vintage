name: Deploy · production

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    uses: ./.github/workflows/verify.yml

  e2e:
    name: E2E (Playwright, iPhone)
    needs: verify
    uses: ./.github/workflows/e2e.yml

  deploy:
    name: Railway (production)
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Seul ce job pousse le tag de version : le jeton en écriture n'est pas exposé aux jobs de test.
    permissions:
      contents: write
    # L'environnement GitHub « production » porte les relecteurs obligatoires (approbation manuelle).
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://chine.app' }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Railway CLI
        run: npm install -g @railway/cli
      - name: Commit déployé (ARG de build + variable d'exécution)
        run: railway variables --service ${{ vars.RAILWAY_SERVICE || 'web' }} --environment production --set "APP_COMMIT=${GITHUB_SHA}" --skip-deploys
      - name: Déploiement
        run: railway up --service ${{ vars.RAILWAY_SERVICE || 'web' }} --environment production --ci
      - name: Vérification de disponibilité
        run: |
          url="${{ vars.PRODUCTION_URL || 'https://chine.app' }}"
          # Le déploiement est accepté quand /api/ready répond 200 ET sert ce commit (sinon c'est l'ancien).
          for i in $(seq 1 60); do
            body="$(curl -fsS "$url/api/ready" 2>/dev/null || true)"
            if [ -n "$body" ] && echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then echo "ready: $body"; exit 0; fi
            sleep 10
          done
          echo "::error::$url/api/ready ne sert pas le commit ${GITHUB_SHA} après 10 minutes (dernière réponse : $body)"; exit 1
      - name: Étiquette de version
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Production : $tag"
          git push origin "$tag"
