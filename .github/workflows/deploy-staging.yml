name: Deploy · staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    uses: ./.github/workflows/verify.yml

  deploy:
    name: Railway (staging)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.chine.app' }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Railway CLI
        run: npm install -g @railway/cli
      - name: Commit déployé (ARG de build + variable d'exécution)
        run: railway variables --service ${{ vars.RAILWAY_SERVICE || 'web' }} --environment staging --set "APP_COMMIT=${GITHUB_SHA}" --skip-deploys
      - name: Déploiement
        run: railway up --service ${{ vars.RAILWAY_SERVICE || 'web' }} --environment staging --ci
      - name: Vérification de disponibilité
        run: |
          url="${{ vars.STAGING_URL || 'https://staging.chine.app' }}"
          # Le déploiement est accepté quand /api/ready répond 200 ET sert ce commit (sinon c'est l'ancien).
          for i in $(seq 1 60); do
            body="$(curl -fsS "$url/api/ready" 2>/dev/null || true)"
            if [ -n "$body" ] && echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then echo "ready: $body"; exit 0; fi
            sleep 10
          done
          echo "::error::$url/api/ready ne sert pas le commit ${GITHUB_SHA} après 10 minutes (dernière réponse : $body)"; exit 1
