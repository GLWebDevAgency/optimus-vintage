name: Deploy · staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    uses: ./.github/workflows/verify.yml

  deploy:
    name: Railway (staging)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.chine.app' }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Railway CLI
        run: npm install -g @railway/cli
      - name: Déploiement
        run: railway up --service ${{ vars.RAILWAY_SERVICE || 'web' }} --environment staging --ci
      - name: Vérification de disponibilité
        run: |
          url="${{ vars.STAGING_URL || 'https://staging.chine.app' }}"
          for i in $(seq 1 30); do
            if curl -fsS "$url/api/ready" >/dev/null; then echo "ready"; exit 0; fi
            sleep 10
          done
          echo "::error::$url/api/ready ne répond pas après 5 minutes"; exit 1
