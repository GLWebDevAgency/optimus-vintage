name: E2E (réutilisable)

on:
  workflow_call:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BETTER_AUTH_SECRET: ci-secret-not-for-production-0123456789
      BETTER_AUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      CHINE_ALLOW_NO_MAILER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Les paquets compilés (domain, application, infrastructure) doivent exister avant `next build`.
      - run: pnpm turbo run build --filter='@chine/web^...'
      - run: pnpm --filter @chine/web exec playwright install --with-deps chromium
      - run: pnpm --filter @chine/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
