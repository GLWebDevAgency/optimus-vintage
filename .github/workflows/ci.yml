name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    uses: ./.github/workflows/verify.yml

  e2e:
    name: E2E (Playwright, iPhone)
    needs: verify
    uses: ./.github/workflows/e2e.yml
