# Mises à jour de dépendances hebdomadaires, groupées pour limiter le bruit ; la CI (lint, typecheck,
# tests, build) reste le juge. Les mises à jour majeures sont proposées séparément.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctifs:
        update-types: ["minor", "patch"]
    labels: ["dépendances"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dépendances"]
