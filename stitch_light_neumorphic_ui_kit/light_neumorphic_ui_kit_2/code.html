<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Neumorphic Design System Light</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: "#FF7D05", // Orange accent
                    "background-light": "#E0E5EC", // Classic neumorphic base
                    "text-light": "#4A5568",
                    "text-dim": "#A0AEC0",
                },
                fontFamily: {
                    display: ["Nunito", "sans-serif"],
                },
                borderRadius: {
                    DEFAULT: "1rem",
                    'xl': "1rem", // Tighter radius for buttons
                    '2xl': "1.5rem",
                    '3xl': "2rem",
                },
                boxShadow: {
                    // Light Mode Neumorphism
                    'neu-flat': '9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5)',
                    'neu-pressed': 'inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8)',
                    'neu-convex': '6px 6px 10px 0 rgba(163,177,198, 0.7), -6px -6px 10px 0 rgba(255,255,255, 0.8)',
                    'neu-icon': '3px 3px 6px 0 rgba(163,177,198, 0.7), -3px -3px 6px 0 rgba(255,255,255, 0.8)',
                    'neu-sm': '3px 3px 6px rgb(163,177,198,0.6), -3px -3px 6px rgba(255,255,255, 0.5)',
                    'neu-pressed-sm': 'inset 2px 2px 4px 0 rgba(163,177,198, 0.7), inset -2px -2px 4px 0 rgba(255,255,255, 0.8)',
                }
            },
        },
    };
</script>
<style>
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    body {
        min-height: max(884px, 100dvh);
    }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-100 font-display flex items-center justify-center min-h-screen p-4">
<div class="w-full max-w-sm bg-background-light rounded-[3rem] shadow-2xl overflow-hidden relative border-[10px] border-gray-100 h-[840px] flex flex-col">
<div class="px-8 pt-6 pb-2 flex justify-between items-center text-text-light opacity-60 text-xs font-bold z-20">
<span>9:41</span>
<div class="flex items-center space-x-1">
<span class="material-icons-round text-sm">signal_cellular_alt</span>
<span class="material-icons-round text-sm">wifi</span>
<span class="material-icons-round text-sm">battery_full</span>
</div>
</div>
<div class="px-8 py-4 flex justify-between items-center z-20">
<button class="w-10 h-10 rounded-xl flex items-center justify-center bg-background-light shadow-neu-convex text-text-light active:shadow-neu-pressed transition-all">
<span class="material-icons-round text-xl">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-text-light tracking-wide">Design System</h1>
<button class="w-10 h-10 rounded-xl flex items-center justify-center bg-background-light shadow-neu-convex text-text-light active:shadow-neu-pressed transition-all">
<span class="material-icons-round text-xl">more_horiz</span>
</button>
</div>
<div class="flex-1 overflow-y-auto no-scrollbar px-8 pb-24 space-y-10 pt-4">
<section>
<div class="flex items-center justify-between mb-4">
<h3 class="text-xs font-bold text-text-dim uppercase tracking-widest">Typography</h3>
<span class="text-[10px] text-primary font-bold bg-background-light shadow-neu-pressed px-2 py-1 rounded-lg">Nunito</span>
</div>
<div class="p-6 rounded-2xl bg-background-light shadow-neu-flat space-y-3">
<div class="flex justify-between items-baseline">
<span class="text-2xl font-bold text-text-light">Heading 1</span>
<span class="text-[10px] text-text-dim">Bold 24px</span>
</div>
<div class="flex justify-between items-baseline border-t border-gray-300/30 pt-3">
<span class="text-lg font-semibold text-text-light">Heading 2</span>
<span class="text-[10px] text-text-dim">SemiBold 18px</span>
</div>
<div class="flex justify-between items-baseline border-t border-gray-300/30 pt-3">
<span class="text-sm font-normal text-text-light">Body Text</span>
<span class="text-[10px] text-text-dim">Regular 14px</span>
</div>
</div>
</section>
<section>
<h3 class="text-xs font-bold text-text-dim uppercase tracking-widest mb-4">Elevation &amp; Depth</h3>
<div class="grid grid-cols-2 gap-6">
<div class="aspect-square rounded-2xl bg-background-light shadow-neu-flat flex flex-col items-center justify-center p-4">
<span class="text-xs font-semibold text-text-light mb-1">Outer</span>
<span class="text-[10px] text-text-dim">Flat / Convex</span>
</div>
<div class="aspect-square rounded-2xl bg-background-light shadow-neu-pressed flex flex-col items-center justify-center p-4">
<span class="text-xs font-semibold text-text-light mb-1">Inner</span>
<span class="text-[10px] text-text-dim">Pressed / Inset</span>
</div>
</div>
</section>
<section>
<h3 class="text-xs font-bold text-text-dim uppercase tracking-widest mb-4">Buttons</h3>
<div class="space-y-6">
<div class="grid grid-cols-2 gap-4">
<button class="py-3 px-4 rounded-xl bg-background-light shadow-neu-flat text-primary font-bold text-sm active:shadow-neu-pressed transition-all">
                        Active
                    </button>
<button class="py-3 px-4 rounded-xl bg-background-light shadow-neu-pressed text-primary font-bold text-sm opacity-80">
                        Pressed
                    </button>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="py-3 px-4 rounded-xl bg-background-light shadow-neu-flat text-text-light font-semibold text-sm active:shadow-neu-pressed transition-all">
                        Normal
                    </button>
<button class="py-3 px-4 rounded-xl bg-background-light shadow-neu-flat text-text-light font-semibold text-sm opacity-50 cursor-not-allowed">
                        Disabled
                    </button>
</div>
<div class="flex justify-between items-center px-2">
<button class="w-12 h-12 rounded-xl bg-background-light shadow-neu-flat flex items-center justify-center text-text-light active:shadow-neu-pressed active:text-primary transition-all">
<span class="material-icons-round">favorite_border</span>
</button>
<button class="w-12 h-12 rounded-xl bg-background-light shadow-neu-pressed flex items-center justify-center text-primary transition-all">
<span class="material-icons-round">favorite</span>
</button>
<button class="w-12 h-12 rounded-xl bg-background-light shadow-neu-flat flex items-center justify-center text-text-light active:shadow-neu-pressed transition-all">
<span class="material-icons-round">share</span>
</button>
<button class="w-12 h-12 rounded-full bg-background-light shadow-neu-flat flex items-center justify-center text-text-light active:shadow-neu-pressed transition-all">
<span class="material-icons-round">mic</span>
</button>
</div>
</div>
</section>
<section>
<h3 class="text-xs font-bold text-text-dim uppercase tracking-widest mb-4">Controls</h3>
<div class="p-5 rounded-2xl bg-background-light shadow-neu-convex space-y-6">
<div class="p-1.5 rounded-xl bg-background-light shadow-neu-pressed flex">
<div class="flex-1 py-2 text-center text-xs font-bold text-primary bg-background-light shadow-neu-flat rounded-lg">Light</div>
<div class="flex-1 py-2 text-center text-xs font-bold text-text-dim cursor-pointer hover:text-text-light transition-colors">Dark</div>
</div>
<div class="flex items-center justify-between border-b border-gray-300/30 pb-5">
<span class="text-sm font-semibold text-text-light">Switches</span>
<div class="flex space-x-4">
<div class="w-12 h-6 rounded-full bg-background-light shadow-neu-pressed relative flex items-center px-1 cursor-pointer">
<div class="w-4 h-4 rounded-full bg-primary shadow-md absolute right-1"></div>
</div>
<div class="w-12 h-6 rounded-full bg-background-light shadow-neu-pressed relative flex items-center px-1 cursor-pointer">
<div class="w-4 h-4 rounded-full bg-background-light shadow-neu-flat border border-gray-100 absolute left-1"></div>
</div>
</div>
</div>
<div class="flex items-center justify-between">
<span class="text-sm font-semibold text-text-light">Selection</span>
<div class="flex items-center space-x-5">
<div class="w-6 h-6 rounded-md bg-background-light shadow-neu-pressed flex items-center justify-center text-primary cursor-pointer">
<span class="material-icons-round text-sm font-bold">check</span>
</div>
<div class="w-6 h-6 rounded-md bg-background-light shadow-neu-flat cursor-pointer"></div>
<div class="w-6 h-6 rounded-full bg-background-light shadow-neu-pressed flex items-center justify-center cursor-pointer">
<div class="w-3 h-3 rounded-full bg-primary shadow-inner"></div>
</div>
<div class="w-6 h-6 rounded-full bg-background-light shadow-neu-flat cursor-pointer"></div>
</div>
</div>
</div>
</section>
</div>
<div class="absolute bottom-0 w-full p-6 bg-background-light z-30 flex justify-between items-center pb-8 border-t border-white/40">
<div class="flex-1 flex justify-center">
<button class="flex flex-col items-center justify-center space-y-1 group">
<div class="w-12 h-12 rounded-xl flex items-center justify-center bg-background-light shadow-neu-pressed text-primary transition-all">
<span class="material-icons-round text-xl">layers</span>
</div>
<span class="text-[10px] font-bold text-primary">Atoms</span>
</button>
</div>
<div class="flex-1 flex justify-center">
<button class="flex flex-col items-center justify-center space-y-1 group">
<div class="w-12 h-12 rounded-xl flex items-center justify-center bg-background-light shadow-neu-convex text-text-dim group-active:shadow-neu-pressed group-active:text-text-light transition-all">
<span class="material-icons-round text-xl">widgets</span>
</div>
<span class="text-[10px] font-semibold text-text-dim">Components</span>
</button>
</div>
<div class="flex-1 flex justify-center">
<button class="flex flex-col items-center justify-center space-y-1 group">
<div class="w-12 h-12 rounded-xl flex items-center justify-center bg-background-light shadow-neu-convex text-text-dim group-active:shadow-neu-pressed group-active:text-text-light transition-all">
<span class="material-icons-round text-xl">palette</span>
</div>
<span class="text-[10px] font-semibold text-text-dim">Styles</span>
</button>
</div>
</div>
</div>

</body></html>
