<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">

        darkMode: "class",

          extend: {
            colors: {
              "primary": "#25f49d",
              "background-light": "#f5f8f7",

<style>
        /* Custom scrollbar hiding */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background-dark font-display text-gray-200 antialiased selection:bg-primary selection:text-background-dark">
<div class="relative mx-auto flex h-full min-h-screen w-full max-w-md flex-col overflow-x-hidden pb-6">

<header class="sticky top-0 z-50 flex items-center justify-between bg-background-dark/95 px-6 py-4 backdrop-blur-sm">
<button class="flex h-12 w-12 items-center justify-center rounded-full bg-background-dark shadow-neu-icon active:shadow-neu-pressed text-gray-300 transition-all duration-200">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="flex-1 text-center text-lg font-bold tracking-wide text-white">Détails du Lot #4092</h1>
<button class="flex h-12 w-12 items-center justify-center rounded-full bg-background-dark shadow-neu-icon active:shadow-neu-pressed text-gray-300 transition-all duration-200">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</header>

<main class="flex flex-col gap-8 px-6 pt-4">
<!-- Inset Image Carousel -->
<section class="relative">
<div class="w-full rounded-2xl bg-background-dark p-2 shadow-neu-pressed">
<div class="aspect-[4/3] w-full overflow-hidden rounded-xl bg-gray-800 relative">

<div class="h-full w-full bg-cover bg-center" data-alt="Red Nike sneaker product shot on dark background" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuABAJpraxO2rx0bfK3zsWjsFJEWuScuqaTbWVPCEHA2MEcWPw61EaebuHCyV6R9rmfBcl9-1DJwLK4Or5KCrGBaoA0_OkZHneqwUdFSRfb7dDBEeWNHUhiuFrIp1j0cz0AFkK8kTlDMirPnYVXroa5uoY6pC-yrnRd5aFpL2TeVwhPSebnsGC7Ul1UFOcmVf1b0PPagLBWmtSrta1RMUJXu-Td1m5YJKcbAl7zc12PSDo3naHBppFQOt8RFXWXn3jLt1VVHcGR1aTE');"></div>
<!-- Carousel Dots (Floating) -->
<div class="absolute bottom-4 left-1/2 flex -translate-x-1/2 gap-2">
<div class="h-2 w-2 rounded-full bg-primary shadow-[0_0_8px_rgba(37,244,157,0.8)]"></div>
<div class="h-2 w-2 rounded-full bg-white/30 backdrop-blur-sm"></div>
<div class="h-2 w-2 rounded-full bg-white/30 backdrop-blur-sm"></div>
</div>
</div>
</div>
</section>
<!-- Circular Gauges (Financials) -->
<section>
<div class="flex items-start justify-between gap-2">
<!-- Gauge 1: Investissement -->
<div class="flex flex-col items-center gap-3 flex-1">
<div class="relative flex h-24 w-24 items-center justify-center rounded-full bg-background-dark shadow-neu-flat">
<!-- SVG Ring Background -->
<svg class="absolute h-full w-full -rotate-90 transform p-2" viewbox="0 0 36 36">
<path class="text-background-dark drop-shadow-[0_1px_1px_rgba(255,255,255,0.1)]" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" style="filter: drop-shadow(1px 1px 1px rgba(255,255,255,0.05)); opacity: 0.1;"></path>
<!-- Progress -->
<path class="text-primary" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="75, 100" stroke-linecap="round" stroke-width="3"></path>
</svg>
<span class="text-sm font-bold text-white">120€</span>
</div>
<span class="text-xs font-medium text-gray-400">Investissement</span>
</div>
<!-- Gauge 2: Frais -->
<div class="flex flex-col items-center gap-3 flex-1">
<div class="relative flex h-24 w-24 items-center justify-center rounded-full bg-background-dark shadow-neu-flat">
<svg class="absolute h-full w-full -rotate-90 transform p-2" viewbox="0 0 36 36">
<path class="text-background-dark" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" style="opacity: 0.1;"></path>
<path class="text-orange-400" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="20, 100" stroke-linecap="round" stroke-width="3"></path>
</svg>
<span class="text-sm font-bold text-white">15€</span>
</div>
<span class="text-xs font-medium text-gray-400">Frais</span>
</div>
<!-- Gauge 3: Marge -->
<div class="flex flex-col items-center gap-3 flex-1">
<div class="relative flex h-24 w-24 items-center justify-center rounded-full bg-background-dark shadow-neu-flat border border-primary/5">
<svg class="absolute h-full w-full -rotate-90 transform p-2" viewbox="0 0 36 36">
<path class="text-background-dark" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" style="opacity: 0.1;"></path>
<path class="text-primary drop-shadow-[0_0_4px_rgba(37,244,157,0.5)]" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="45, 100" stroke-linecap="round" stroke-width="3"></path>
</svg>
<span class="text-sm font-bold text-primary">+45%</span>
</div>
<span class="text-xs font-medium text-primary drop-shadow-[0_0_5px_rgba(37,244,157,0.3)]">Marge est.</span>
</div>
</div>
</section>
<!-- Specifications (Sunken Bars) -->
<section class="flex flex-col gap-4">
<h2 class="ml-1 text-lg font-bold text-white">Caractéristiques</h2>
<div class="flex flex-col gap-3">
<!-- Spec Item -->
<div class="flex items-center justify-between rounded-xl bg-background-dark p-4 shadow-neu-pressed">
<span class="text-sm font-medium text-gray-400">Marque</span>
<span class="font-bold text-white">Nike</span>
</div>
<!-- Spec Item -->
<div class="flex items-center justify-between rounded-xl bg-background-dark p-4 shadow-neu-pressed">
<span class="text-sm font-medium text-gray-400">Modèle</span>
<span class="font-bold text-white">Dunk Low Retro</span>
</div>
<!-- Spec Item -->
<div class="flex items-center justify-between rounded-xl bg-background-dark p-4 shadow-neu-pressed">
<span class="text-sm font-medium text-gray-400">Taille</span>
<span class="font-bold text-white">42 EU</span>
</div>
<!-- Spec Item -->
<div class="flex items-center justify-between rounded-xl bg-background-dark p-4 shadow-neu-pressed">
<span class="text-sm font-medium text-gray-400">Condition</span>
<span class="font-bold text-primary">Neuf (DS)</span>
</div>
</div>
</section>
<!-- Timeline (Sunken Track) -->
<section class="flex flex-col gap-4">
<h2 class="ml-1 text-lg font-bold text-white">Historique</h2>
<div class="relative pl-2">
<!-- Vertical Track -->
<div class="absolute left-[19px] top-4 h-[calc(100%-2rem)] w-1.5 rounded-full bg-background-dark shadow-neu-pressed"></div>
<!-- Timeline Items -->
<div class="flex flex-col gap-8">
<!-- Step 1: Completed -->
<div class="relative flex items-center gap-4 z-10">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-background-dark shadow-neu-pressed border border-primary/20">
<div class="h-4 w-4 rounded-full bg-primary shadow-[0_0_8px_rgba(37,244,157,0.6)]"></div>
</div>
<div class="flex flex-col">
<span class="text-base font-bold text-white">Achat du lot</span>
<span class="text-xs text-gray-400">12 Oct 2023 • Validé</span>
</div>
</div>
<!-- Step 2: Current -->
<div class="relative flex items-center gap-4 z-10">
<!-- Outer glow for current step -->
<div class="absolute -left-[5px] h-[50px] w-[50px] rounded-full bg-primary/10 blur-lg"></div>
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-background-dark shadow-neu-flat">
<span class="material-symbols-outlined text-primary text-[20px] animate-pulse">cleaning_services</span>
</div>
<div class="flex flex-col">
<span class="text-base font-bold text-primary">Nettoyage &amp; Prépa</span>
<span class="text-xs text-gray-400">En cours...</span>
</div>
</div>
<!-- Step 3: Pending -->
<div class="relative flex items-center gap-4 z-10">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-background-dark shadow-neu-pressed opacity-60">
<div class="h-3 w-3 rounded-full bg-gray-600"></div>
</div>
<div class="flex flex-col opacity-60">
<span class="text-base font-bold text-white">Mise en vente</span>
<span class="text-xs text-gray-500">En attente</span>
</div>
</div>
</div>
</div>
</section>
<!-- Bottom Action -->
<div class="sticky bottom-6 mt-4">
<button class="w-full rounded-2xl bg-background-dark py-4 text-center font-bold text-primary shadow-neu-flat shadow-glow transition-all active:scale-[0.98] active:shadow-neu-pressed">
                    Modifier le Lot
                </button>
</div>
</main>
</div>
