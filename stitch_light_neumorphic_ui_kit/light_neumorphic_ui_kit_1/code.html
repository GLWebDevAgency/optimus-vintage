<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Neumorphic UI Kit - Mobile Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FF7D05", // Orange accent from the image
                        "background-light": "#E0E5EC", // Classic neumorphic base
                        "background-dark": "#2D2D35", // Dark mode base
                        "surface-light": "#E0E5EC",
                        "surface-dark": "#2D2D35",
                        "text-light": "#4A5568",
                        "text-dark": "#E2E8F0",
                    },
                    fontFamily: {
                        display: ["Nunito", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        'xl': "1.5rem",
                        '2xl': "2rem",
                    },
                    boxShadow: {
                        // Light Mode Neumorphism
                        'neu-flat': '9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5)',
                        'neu-pressed': 'inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8)',
                        'neu-convex': '6px 6px 10px 0 rgba(163,177,198, 0.7), -6px -6px 10px 0 rgba(255,255,255, 0.8)',
                        'neu-icon': '3px 3px 6px 0 rgba(163,177,198, 0.7), -3px -3px 6px 0 rgba(255,255,255, 0.8)',
                        // Dark Mode Neumorphism
                        'neu-flat-dark': '6px 6px 12px #202025, -6px -6px 12px #3a3a45',
                        'neu-pressed-dark': 'inset 4px 4px 8px #202025, inset -4px -4px 8px #3a3a45',
                        'neu-convex-dark': '5px 5px 10px #1e1e23, -5px -5px 10px #3c3c47',
                    }
                },
            },
        };
    </script>
<style>.no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-100 dark:bg-gray-900 font-display flex items-center justify-center min-h-screen p-4">

<span>9:41</span>

</div>
</div>

<span class="material-icons-round text-lg">menu</span>
</button>
<div class="text-center">
<h2 class="text-xs tracking-widest uppercase text-text-light dark:text-text-dark opacity-60 font-bold">Dashboard</h2>

<span class="material-icons-round text-lg">person</span>
</button>
</div>

<div>

                        88
                    </div>
</div>

</div>

</div>
</div>
<div class="pt-4 flex justify-center">
<button class="w-full py-4 rounded-xl bg-background-light dark:bg-background-dark shadow-neu-flat dark:shadow-neu-flat-dark text-primary font-bold tracking-wider text-sm active:shadow-neu-pressed dark:active:shadow-neu-pressed-dark transition-all">
                    GENERATE REPORT
                </button>
</div>
</div>
<div class="absolute bottom-0 w-full p-6 bg-background-light dark:bg-background-dark z-10 flex justify-between items-center pb-8 border-t border-white/20 dark:border-black/10">
<button class="w-12 h-12 rounded-xl flex items-center justify-center bg-background-light dark:bg-background-dark shadow-neu-convex dark:shadow-neu-convex-dark text-text-light dark:text-text-dark active:shadow-neu-pressed dark:active:shadow-neu-pressed-dark active:text-primary transition-all group">

<button class="w-12 h-12 rounded-xl flex items-center justify-center bg-background-light dark:bg-background-dark shadow-neu-pressed dark:shadow-neu-pressed-dark text-primary transition-all">

<button class="w-12 h-12 rounded-xl flex items-center justify-center bg-background-light dark:bg-background-dark shadow-neu-convex dark:shadow-neu-convex-dark text-text-light dark:text-text-dark active:shadow-neu-pressed dark:active:shadow-neu-pressed-dark active:text-primary transition-all group">

</div>
