<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4c025",
                        "obsidian-dark": "#0a0a0a",
                        "obsidian-light": "#1a1a1a",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    backgroundImage: {
                        'obsidian-gradient': 'linear-gradient(145deg, #1a1a1a, #050505)',
                        'gold-glow': 'radial-gradient(circle at center, rgba(244, 192, 37, 0.15) 0%, rgba(0,0,0,0) 70%)',
                    },
                    boxShadow: {
                        'obsidian': 'inset 1px 1px 1px rgba(255, 255, 255, 0.05), 0 10px 30px -10px rgba(0, 0, 0, 0.8)',
                        'gold-leak': '0 0 20px rgba(244, 192, 37, 0.1)',
                        'gold-hard': '0 0 5px rgba(244, 192, 37, 0.5)',
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                },
            },
        }
    </script>
<style>.no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .chromatic-text {
            text-shadow: 1px 0px 1px rgba(255, 0, 0, 0.2), -1px 0px 1px rgba(0, 0, 255, 0.2);
        }
        .obsidian-block {
            position: relative;
            background: linear-gradient(160deg, #161616 0%, #050505 100%);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: all 0.3s ease;
        }.obsidian-block.accent-gold::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #f4c025;
            box-shadow: 0 0 10px #f4c025;
        }
        .obsidian-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .floating-element {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes scan {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, transparent, rgba(244, 192, 37, 0.1), transparent);
            animation: scan 3s linear infinite;
            pointer-events: none;
        }
    </style>
<style>
        body {

    </style>
<style>
