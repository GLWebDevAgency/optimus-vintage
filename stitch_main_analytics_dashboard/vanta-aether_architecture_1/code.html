<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vanta-Aether Dashboard</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4c025",
                        "obsidian-dark": "#0a0a0a",
                        "obsidian-light": "#1a1a1a",
                        "background-dark": "#000000",
                        "background-light": "#f8f8f5", // Fallback, but design is primarily dark
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    backgroundImage: {
                        'obsidian-gradient': 'linear-gradient(145deg, #1a1a1a, #050505)',
                        'gold-glow': 'radial-gradient(circle at center, rgba(244, 192, 37, 0.15) 0%, rgba(0,0,0,0) 70%)',
                    },
                    boxShadow: {
                        'obsidian': 'inset 1px 1px 1px rgba(255, 255, 255, 0.05), 0 10px 30px -10px rgba(0, 0, 0, 0.8)',
                        'gold-leak': '0 0 20px rgba(244, 192, 37, 0.1)',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Simulating the "microscopic chromatic fringes" mentioned in prompt with a very subtle text shadow */
        .chromatic-text {
            text-shadow: 1px 0px 1px rgba(255, 0, 0, 0.2), -1px 0px 1px rgba(0, 0, 255, 0.2);
        }

        /* Obsidian block shine effect */
        .obsidian-block {
            position: relative;
            background: linear-gradient(160deg, #1c1c1c 0%, #080808 100%);
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .obsidian-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
        }

        /* Gravity Disk Animation placeholder */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .floating-element {
            animation: float 6s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-white font-display antialiased selection:bg-primary selection:text-black overflow-x-hidden min-h-screen flex flex-col items-center justify-center">
<!-- Main Container: Simulating iOS Phone Form Factor -->
<main class="w-full max-w-md mx-auto min-h-screen relative flex flex-col p-6 gap-8 z-10">
<!-- Header: Minimal UI Chrome -->
<header class="flex justify-between items-center py-2 opacity-80">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-opacity-80 text-sm">grid_view</span>
<span class="text-xs tracking-[0.2em] text-white/40 font-bold uppercase">Nexus-01</span>
</div>
<div class="flex items-center gap-3">
<div class="h-2 w-2 rounded-full bg-primary animate-pulse shadow-gold-leak"></div>
<span class="text-xs tracking-widest text-white/40">CONNECTED</span>
</div>
</header>
<!-- Hero Section: Gravity Disk -->
<section class="flex flex-col items-center justify-center py-8 relative">
<div class="absolute inset-0 bg-gold-glow pointer-events-none"></div>
<!-- Title -->
<h1 class="text-white/60 tracking-[0.2em] text-sm font-light uppercase mb-8 chromatic-text text-center">System Singularity</h1>
<!-- Gravity Disk / Mercury Ring -->
<div class="relative size-64 flex items-center justify-center floating-element">
<!-- Outer faint ring -->
<div class="absolute inset-0 rounded-full border border-white/5"></div>
<!-- The "Mercury" Ring - SVG Stroke -->
<svg class="absolute inset-0 rotate-[-90deg] transform" height="256" viewbox="0 0 256 256" width="256">
<circle cx="128" cy="128" fill="none" r="110" stroke="#1a1a1a" stroke-width="2"></circle>
<!-- Dynamic stroke dasharray for 78% -->
<circle class="drop-shadow-[0_0_10px_rgba(244,192,37,0.5)]" cx="128" cy="128" fill="none" r="110" stroke="#f4c025" stroke-dasharray="691" stroke-dashoffset="152" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Inner Content -->
<div class="flex flex-col items-center justify-center z-10 text-center">
<span class="text-6xl font-bold text-white tracking-tighter chromatic-text">94<span class="text-2xl text-primary/80">%</span></span>
<span class="text-primary/60 text-xs tracking-[0.2em] uppercase mt-2">Optimal Flow</span>
</div>
</div>
</section>
<!-- Monoliths: Tier 1 Data -->
<section class="grid grid-cols-2 gap-4">
<!-- Left Monolith: Velocity -->
<div class="obsidian-block rounded-lg p-5 flex flex-col justify-between h-40 group relative transition-all duration-500 hover:bg-[#111]">
<!-- Subtle internal light leak on hover -->
<div class="absolute bottom-0 right-0 w-24 h-24 bg-primary/5 blur-2xl rounded-full translate-x-10 translate-y-10 group-hover:bg-primary/10 transition-colors"></div>
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-white/30 text-lg">bolt</span>
<span class="text-[10px] text-primary tracking-widest font-bold">+12%</span>
</div>
<div class="flex flex-col gap-1 z-10">
<span class="text-white/40 text-[10px] uppercase tracking-widest">Velocity</span>
<span class="text-2xl text-white font-medium chromatic-text">4.2 <span class="text-sm text-white/30">TB/s</span></span>
</div>
<!-- Visual Element: Vertical Bars simulating structure -->
<div class="flex items-end gap-1 h-8 mt-2 opacity-50">
<div class="w-1 bg-primary/20 h-[40%] rounded-t-sm"></div>
<div class="w-1 bg-primary/40 h-[70%] rounded-t-sm"></div>
<div class="w-1 bg-primary h-[100%] rounded-t-sm shadow-[0_0_8px_rgba(244,192,37,0.4)]"></div>
<div class="w-1 bg-primary/60 h-[60%] rounded-t-sm"></div>
<div class="w-1 bg-primary/20 h-[30%] rounded-t-sm"></div>
</div>
</div>
<!-- Right Monolith: Encryption -->
<div class="obsidian-block rounded-lg p-5 flex flex-col justify-between h-40 group relative transition-all duration-500 hover:bg-[#111]">
<div class="absolute top-0 left-0 w-24 h-24 bg-primary/5 blur-2xl rounded-full -translate-x-10 -translate-y-10 group-hover:bg-primary/10 transition-colors"></div>
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-white/30 text-lg">lock</span>
<span class="text-[10px] text-primary tracking-widest font-bold">SECURE</span>
</div>
<div class="flex flex-col gap-1 z-10">
<span class="text-white/40 text-[10px] uppercase tracking-widest">Encryption</span>
<span class="text-2xl text-white font-medium chromatic-text">AES <span class="text-sm text-white/30">4096</span></span>
</div>
<!-- Visual Element: Cryptic hash lines -->
<div class="flex flex-col gap-1 mt-2">
<div class="h-[1px] w-full bg-gradient-to-r from-primary/0 via-primary/40 to-primary/0"></div>
<div class="flex justify-between text-[8px] text-white/20 font-mono tracking-widest">
<span>EF45</span>
<span>::</span>
<span>A901</span>
</div>
<div class="h-[1px] w-full bg-gradient-to-r from-primary/0 via-primary/20 to-primary/0"></div>
</div>
</div>
</section>
<!-- Monolith: Tier 2 Data (Pulse Stream) -->
<section class="obsidian-block rounded-lg p-6 flex flex-col gap-4 relative">
<div class="flex justify-between items-end">
<div class="flex flex-col gap-1">
<h3 class="text-white/40 text-xs uppercase tracking-[0.2em]">Pulse Stream</h3>
<p class="text-xl text-white font-medium">Network Coherence</p>
</div>
<div class="flex items-center gap-2">
<span class="h-1.5 w-1.5 rounded-full bg-primary animate-ping"></span>
<span class="text-primary text-xs font-bold tracking-widest">LIVE</span>
</div>
</div>
<!-- Gold Fissure Chart -->
<div class="w-full h-24 relative mt-2">
<!-- Grid Lines -->
<div class="absolute inset-0 flex flex-col justify-between pointer-events-none">
<div class="w-full h-[1px] bg-white/5"></div>
<div class="w-full h-[1px] bg-white/5"></div>
<div class="w-full h-[1px] bg-white/5"></div>
</div>
<!-- Chart Line SVG -->
<svg class="w-full h-full overflow-visible" preserveaspectratio="none" viewbox="0 0 300 100">
<defs>
<lineargradient id="gold-fill" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#f4c025" stop-opacity="0.2"></stop>
<stop offset="100%" stop-color="#f4c025" stop-opacity="0"></stop>
</lineargradient>
</defs>
<path d="M0 80 C 40 80, 50 20, 90 20 S 140 60, 180 60 S 220 30, 260 30 S 300 50, 300 50 L 300 100 L 0 100 Z" fill="url(#gold-fill)"></path>
<path class="drop-shadow-[0_0_6px_rgba(244,192,37,0.6)]" d="M0 80 C 40 80, 50 20, 90 20 S 140 60, 180 60 S 220 30, 260 30 S 300 50, 300 50" fill="none" stroke="#f4c025" stroke-width="2"></path>
</svg>
</div>
<!-- Timeline Labels -->
<div class="flex justify-between text-[10px] text-white/20 font-mono pt-2">
<span>T-00</span>
<span>T-15</span>
<span>T-30</span>
<span>T-45</span>
<span>NOW</span>
</div>
</section>
<!-- Bottom Navigation / Controls (Light Leaks) -->
<nav class="mt-auto pt-4 flex justify-around items-center w-full px-8 relative">
<!-- Decorative line -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/3 h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
<button class="group p-4 rounded-full relative flex items-center justify-center">
<div class="absolute inset-0 bg-primary/0 blur-md rounded-full group-hover:bg-primary/20 transition-all duration-500"></div>
<span class="material-symbols-outlined text-white/40 group-hover:text-primary transition-colors duration-300">home_app_logo</span>
</button>
<button class="group p-4 rounded-full relative flex items-center justify-center">
<div class="absolute inset-0 bg-primary/0 blur-xl rounded-full group-hover:bg-primary/30 transition-all duration-500"></div>
<div class="h-12 w-12 rounded-full border border-white/10 bg-[#111] flex items-center justify-center shadow-lg group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary drop-shadow-[0_0_5px_rgba(244,192,37,0.8)]">fingerprint</span>
</div>
</button>
<button class="group p-4 rounded-full relative flex items-center justify-center">
<div class="absolute inset-0 bg-primary/0 blur-md rounded-full group-hover:bg-primary/20 transition-all duration-500"></div>
<span class="material-symbols-outlined text-white/40 group-hover:text-primary transition-colors duration-300">settings_motion_mode</span>
</button>
</nav>
</main>
</body></html>
